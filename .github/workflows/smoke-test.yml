name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  alltest:
    runs-on: ubuntu-latest
    container:
      image: opencfd/openfoam-default:2406
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run Alltest
        shell: bash
        run: |
          # OpenFOAM's etc/bashrc uses pop_var_context in a way that trips
          # `set -e` under bash -eo pipefail, so briefly disable -e while
          # sourcing, then re-enable it and verify the env was set.
          set +e
          source /usr/lib/openfoam/openfoam2406/etc/bashrc
          set -eo pipefail
          [ -n "$WM_PROJECT_DIR" ] || { echo "OpenFOAM env not set"; exit 1; }

          ./Allwmake -j
          ./run/Alltest

      - name: Upload case logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alltest-logs
          path: |
            run/**/log.*
            run/**/slurm_*.out
          if-no-files-found: ignore
