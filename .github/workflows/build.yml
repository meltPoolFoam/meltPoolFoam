name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/release

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build (and cache) the release image from Dockerfile.release.
  # Pushes to GHCR so the next job can pull it as its container.
  # ---------------------------------------------------------------------------
  image:
    name: Build release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          # Lowercase the repo name (GHCR requires lowercase).
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: run Allwmake inside the image we just built.
  # ---------------------------------------------------------------------------
  allwmake:
    name: Allwmake
    needs: image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    container:
      image: ${{ needs.image.outputs.image }}:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show toolchain
        run: |
          source /usr/lib/openfoam/openfoam2406/etc/bashrc
          echo "WM_PROJECT_DIR = $WM_PROJECT_DIR"
          echo "WM_OPTIONS     = $WM_OPTIONS"
          gcc --version
          git --version

      - name: Build with Allwmake
        run: |
          source /usr/lib/openfoam/openfoam2406/etc/bashrc
          chmod +x ./Allwmake
          ./Allwmake -j$(nproc) 2>&1 | tee build.log
          # Allwmake does not propagate wmake failures as a non-zero exit,
          # so scan the log for canonical error markers.
          if grep -E "Error|error:" build.log >/dev/null; then
            echo "::error::Build log contains errors"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
